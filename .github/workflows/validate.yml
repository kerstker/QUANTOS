name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

# cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read           # least privilege: the gate only reads the repo

jobs:
  backend:
    name: backend gate (governance scanner + all test suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/research-console/package-lock.json
      - name: Verify dependency lock
        run: python scripts/generate_ci_dependency_lock.py --check
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - name: Install frontend dependencies for the canonical gate
        working-directory: apps/research-console
        run: npm ci
      - name: Verify repository layout and public documentation
        run: python scripts/check_repository_hygiene.py
      - name: Fail-closed validation gate
        run: python scripts/validate.py        # offline + deterministic: needs no secrets/network

  backend-coverage:
    name: backend coverage regression floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Verify dependency lock
        run: python scripts/generate_ci_dependency_lock.py --check
      - name: Install hash-locked dev dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - name: Enforce canonical backend coverage floors
        run: python scripts/run_backend_coverage.py

  frontend:
    name: frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-console
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/research-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npx playwright install chromium
      - run: npm run e2e
      - name: Upload Playwright visual diff
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-visual-diff-${{ github.run_id }}
          path: apps/research-console/test-results/
          if-no-files-found: ignore
          retention-days: 7
