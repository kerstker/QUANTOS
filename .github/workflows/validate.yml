name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

# cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read           # least privilege: the gate only reads the repo

jobs:
  backend:
    name: backend gate (governance scanner + all test suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/research-console/package-lock.json
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install frontend dependencies for the canonical gate
        working-directory: apps/research-console
        run: npm ci
      - name: Fail-closed validation gate
        run: python scripts/validate.py        # offline + deterministic: needs no secrets/network

  frontend:
    name: frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-console
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/research-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run e2e
