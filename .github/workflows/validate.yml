name: validate

on:
  push:
    branches: [main, master]
  pull_request:

# cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read           # least privilege: the gate only reads the repo

jobs:
  backend:
    name: backend gate (governance scanner + all test suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Fail-closed validation gate
        run: python scripts/validate.py        # offline + deterministic: needs no secrets/network

  frontend:
    name: frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/research-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
