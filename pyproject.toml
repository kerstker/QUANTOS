# QUANTOS - Python toolchain & dependency manifest (Phase 0.5 baseline).
#
# NOTE: pytest is intentionally NOT configured here ([tool.pytest.ini_options]
# is omitted on purpose). The repository currently has two distinct `services`
# package trees (repo-root services/ and apps/research-console/services/) that
# collide in a single pytest process. Adding a pytest config block here would
# force pytest's rootdir to the repo root and re-break the apps/research-console
# suite. Until the trees are unified (tracked for Phase 1), the canonical way to
# run tests is `python scripts/validate.py`, which runs each suite group from
# its correct working directory.

[project]
name = "quantos"
version = "0.0.0"
description = "QUANTOS - AI quantitative trading research platform (L2_DRY_RUN_ONLY)"
requires-python = ">=3.11"   # minimum; the pinned dev/CI interpreter is 3.12 (.python-version) — Rank #28

# Runtime dependencies actually imported by the currently-runnable code
# (services/console/api). Pinned to the versions validated locally.
dependencies = [
    "fastapi==0.139.2",
    "starlette==1.3.1",
    "uvicorn==0.40.0",
    "pydantic==2.13.4",
    "PyJWT==2.13.0",
]

[project.optional-dependencies]
# Imported only by the QUARANTINED pre_trade_risk service; required when it is
# rebuilt in Phase 8 (Risk Layer). Not needed for the current test gate.
pre_trade_risk = [
    "aiokafka==0.13.0",
    "prometheus_client==0.21.1",
]
# research ML layer (services/research/ml): deterministic stacking over existing factor signals.
# Non-network, used deterministically (fixed random_state, single-thread). Not needed by console_api.
research-ml = [
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
]
# live backup encryption (tools/live_backup.py). 2026-07-08 code review fix: previously
# undeclared (only "happened to be installed" via unrelated tools) even though the
# fail-closed passphrase gate makes every scheduled backup depend on it being real.
live-backup = [
    "cryptography==49.0.0",
]
supply-chain = [
    "pip-audit==2.10.1",
    "sigstore==4.4.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
